<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .cursor-glow {
      position: fixed;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34, 197, 94, 0.25) 0%, rgba(34, 197, 94, 0.08) 40%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s ease;
      will-change: left, top;
    }

    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: orbFloat 8s ease-in-out infinite alternate;
    }

    .glow-orb-1 {
      width: 400px;
      height: 400px;
      background: rgba(34, 197, 94, 0.12);
      top: -100px;
      right: -100px;
    }

    .glow-orb-2 {
      width: 350px;
      height: 350px;
      background: rgba(34, 197, 94, 0.08);
      bottom: -80px;
      left: -80px;
      animation-delay: 4s;
    }

    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.15); }
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 20px;
      margin-top: -30px;
      opacity: 0;
      animation: fadeIn 1.2s ease forwards;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .avatar-wrapper {
      position: relative;
      margin-bottom: 40px;
    }

    .avatar-ring {
      position: absolute;
      top: -16px;
      left: -16px;
      width: calc(100% + 32px);
      height: calc(100% + 32px);
      border-radius: 50%;
      background: conic-gradient(#22c55e, #166534, #22c55e, #14532d, #22c55e);
      animation: ringSpin 4s linear infinite;
      z-index: -1;
    }

    @keyframes ringSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .avatar-glow {
      position: absolute;
      top: -40px;
      left: -40px;
      width: calc(100% + 80px);
      height: calc(100% + 80px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34, 197, 94, 0.3) 0%, transparent 70%);
      animation: pulseGlow 1.5s ease-in-out infinite;
      z-index: -2;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(0.95); opacity: 0.5; }
      14% { transform: scale(1.15); opacity: 1; }
      28% { transform: scale(0.95); opacity: 0.5; }
      42% { transform: scale(1.1); opacity: 0.8; }
      56% { transform: scale(0.95); opacity: 0.5; }
    }

    .avatar {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(34, 197, 94, 0.5);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      display: block;
      position: relative;
      animation: heartbeat 1.5s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.08); }
      28% { transform: scale(1); }
      42% { transform: scale(1.06); }
      56% { transform: scale(1); }
    }

    .avatar:hover {
      animation: none;
      transform: scale(1.08);
      box-shadow: 0 0 80px rgba(34, 197, 94, 0.5);
    }

    .player-wrap {
      perspective: 1200px;
      width: 100%;
      max-width: 780px;
      animation: fadeIn 1.2s ease 0.3s both;
    }

    .player {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(34, 197, 94, 0.15);
      border-radius: 24px;
      padding: 26px 32px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 60px rgba(34, 197, 94, 0.05);
      transition: transform 0.15s ease, box-shadow 0.3s ease;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .player:hover {
      box-shadow: 0 12px 50px rgba(0, 0, 0, 0.6), 0 0 80px rgba(34, 197, 94, 0.08);
    }

    .btn-play {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(34, 197, 94, 0.3);
      background: rgba(34, 197, 94, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-play:hover {
      background: rgba(34, 197, 94, 0.2);
      border-color: rgba(34, 197, 94, 0.6);
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.2);
    }

    .btn-play svg {
      width: 18px;
      height: 18px;
      fill: #22c55e;
      display: block;
    }

    .disc {
      flex-shrink: 0;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .disc img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      animation: spinDisc 6s linear infinite;
      border: 2px solid rgba(34, 197, 94, 0.2);
    }

    .disc::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #0a0a0a;
      border: none;
      z-index: 2;
    }

    @keyframes spinDisc {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .player-info {
      flex: 1;
      min-width: 0;
    }

    .player-info .song {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-info .artist {
      font-size: 14px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
    }

    .player-right {
      flex-shrink: 0;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .time {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.5);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.3px;
    }

    .progress-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      border-radius: 4px;
      transition: width 0.1s linear;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
      position: relative;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.7);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .progress-wrap:hover .progress-bar::after {
      opacity: 1;
    }

    .socials {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 36px;
      animation: fadeIn 1.2s ease 0.5s both;
    }

    .socials a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(34, 197, 94, 0.2);
      text-decoration: none;
      transition: all 0.35s ease;
      position: relative;
    }

    .socials a svg {
      width: 22px;
      height: 22px;
      fill: #fff;
      transition: fill 0.35s ease;
    }

    .socials a:hover {
      transform: translateY(-5px) scale(1.12);
      border-color: rgba(34, 197, 94, 0.6);
      box-shadow: 0 8px 30px rgba(34, 197, 94, 0.25);
    }

    .socials a:hover svg {
      fill: #22c55e;
    }

    .btn-shop {
      margin-top: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 18px 80px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: 14px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.35s ease;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
      animation: fadeIn 1.2s ease 0.6s both;
      position: relative;
      overflow: hidden;
    }

    .btn-arrow {
      transition: transform 0.35s ease;
    }

    .btn-shop:hover .btn-arrow {
      transform: translateX(10px);
    }

    .btn-shop::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.25), rgba(34, 197, 94, 0.05));
      opacity: 0;
      transition: opacity 0.35s ease;
      border-radius: 14px;
    }

    .btn-shop::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.6), transparent, rgba(34, 197, 94, 0.3));
      z-index: -1;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .btn-shop:hover {
      transform: translateY(-4px) scale(1.2);
      border-color: rgba(34, 197, 94, 0.7);
      color: #b8f5c4;
      box-shadow: 0 12px 50px rgba(0, 0, 0, 0.5), 0 0 80px rgba(34, 197, 94, 0.35), 0 0 120px rgba(34, 197, 94, 0.15);
    }

    .btn-shop:hover::before {
      opacity: 1;
    }

    .btn-shop:hover::after {
      opacity: 1;
    }

    .btn-shop:active {
      transform: translateY(-2px) scale(0.98);
    }

    .shop-wrap {
      perspective: 800px;
      margin-top: 48px;
      animation: fadeIn 1.2s ease 0.6s both;
    }

    .shop-wrap .btn-shop {
      margin-top: 0;
      animation: none;
    }

    @media (max-width: 768px) {
      .avatar {
        width: 175px;
        height: 175px;
      }

      .player {
        flex-wrap: wrap;
        padding: 20px 22px;
        gap: 14px;
        border-radius: 20px;
      }

      .player-right {
        width: 100%;
        flex-direction: row;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
      }

      .progress-wrap {
        flex: 1;
      }

      .disc {
        width: 58px;
        height: 58px;
      }

      .btn-play {
        width: 38px;
        height: 38px;
      }

      .btn-play svg {
        width: 15px;
        height: 15px;
      }

      .player-info .song {
        font-size: 16px;
      }

      .player-info .artist {
        font-size: 13px;
      }

      .btn-shop {
        padding: 16px 50px;
        font-size: 13px;
        letter-spacing: 2px;
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      .socials {
        gap: 14px;
        margin-top: 28px;
      }

      .socials a {
        width: 46px;
        height: 46px;
      }

      .socials a svg {
        width: 19px;
        height: 19px;
      }
    }

    @media (max-width: 480px) {
      .avatar {
        width: 135px;
        height: 135px;
      }

      .player {
        padding: 16px;
        gap: 12px;
        border-radius: 16px;
      }

      .disc {
        width: 48px;
        height: 48px;
      }

      .btn-play {
        width: 34px;
        height: 34px;
      }

      .btn-play svg {
        width: 13px;
        height: 13px;
      }

      .player-info .song {
        font-size: 14px;
      }

      .player-info .artist {
        font-size: 12px;
      }

      .btn-shop {
        padding: 14px 32px;
        font-size: 12px;
        margin-top: 36px;
      }

      .socials {
        gap: 12px;
        margin-top: 24px;
      }

      .socials a {
        width: 40px;
        height: 40px;
      }

      .socials a svg {
        width: 17px;
        height: 17px;
      }
    }
  </style>
</head>

  <script>
    (function() {
      var canvas = document.getElementById('particles-canvas');
      var ctx = canvas.getContext('2d');
      var cursorGlow = document.getElementById('cursorGlow');
      var particles = [];
      var mouse = { x: null, y: null };

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      document.addEventListener('mousemove', function(e) {
        cursorGlow.style.left = e.clientX + 'px';
        cursorGlow.style.top = e.clientY + 'px';
      });

      document.addEventListener('mousemove', function(e) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      document.addEventListener('mouseleave', function() {
        mouse.x = null;
        mouse.y = null;
      });

      var PARTICLE_COUNT = 80;
      for (var i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.6,
          vy: (Math.random() - 0.5) * 0.6,
          size: Math.random() * 2.5 + 1,
          alpha: Math.random() * 0.5 + 0.15
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(34, 197, 94, ' + p.alpha + ')';
          ctx.fill();
        }

        for (var i = 0; i < particles.length; i++) {
          for (var j = i + 1; j < particles.length; j++) {
            var dx = particles[i].x - particles[j].x;
            var dy = particles[i].y - particles[j].y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 140) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = 'rgba(34, 197, 94, ' + (0.08 * (1 - dist / 140)) + ')';
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }

        if (mouse.x !== null && mouse.y !== null) {
          for (var i = 0; i < particles.length; i++) {
            var dx = mouse.x - particles[i].x;
            var dy = mouse.y - particles[i].y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 180) {
              ctx.beginPath();
              ctx.moveTo(mouse.x, mouse.y);
              ctx.lineTo(particles[i].x, particles[i].y);
              ctx.strokeStyle = 'rgba(34, 197, 94, ' + (0.12 * (1 - dist / 180)) + ')';
              ctx.lineWidth = 0.8;
              ctx.stroke();
            }
          }
        }

        requestAnimationFrame(draw);
      }
      draw();
    })();

    (function() {
      var audio = document.getElementById('bgAudio');

      var currentTimeEl = document.getElementById('current-time');
      var totalTimeEl = document.getElementById('total-time');
      var progressBar = document.getElementById('progress-bar');
      var progressWrap = document.getElementById('progress-wrap');

      function formatTime(t) {
        if (isNaN(t) || !isFinite(t)) return '0:00';
        var m = Math.floor(t / 60);
        var s = Math.floor(t % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
      }

      audio.addEventListener('loadedmetadata', function() {
        totalTimeEl.textContent = formatTime(audio.duration);
      });

      audio.addEventListener('timeupdate', function() {
        currentTimeEl.textContent = formatTime(audio.currentTime);
        if (audio.duration) {
          var pct = (audio.currentTime / audio.duration) * 100;
          progressBar.style.width = pct + '%';
        }
      });

      progressWrap.addEventListener('click', function(e) {
        var rect = progressWrap.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var pct = x / rect.width;
        if (audio.duration) {
          audio.currentTime = pct * audio.duration;
        }
      });

      audio.addEventListener('error', function() {
        currentTimeEl.textContent = '0:00';
        totalTimeEl.textContent = '0:00';
      });

      setTimeout(function() {
        audio.muted = false;
      }, 200);

      var started = false;
      function ensurePlay() {
        if (started) return;
        started = true;
        audio.muted = false;
        audio.play().catch(function() {});
      }

      document.addEventListener('click', ensurePlay, { once: true });
      document.addEventListener('touchstart', ensurePlay, { once: true });
      document.addEventListener('mousemove', ensurePlay, { once: true });

      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
          audio.play();
        }
      });

      var btnPlay = document.getElementById('btnPlay');
      var playIcon = document.getElementById('playIcon');
      var pauseIcon = document.getElementById('pauseIcon');

      function showPlay() {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }

      function showPause() {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      }

      btnPlay.addEventListener('click', function() {
        if (audio.paused) {
          audio.play().catch(function(){});
          showPause();
        } else {
          audio.pause();
          showPlay();
        }
      });

      audio.addEventListener('play', showPause);
      audio.addEventListener('pause', showPlay);

      setTimeout(function() {
        if (!audio.paused) {
          showPause();
        }
      }, 500);
    })();

    (function() {
      var wrap = document.getElementById('playerWrap');
      var player = document.getElementById('player');
      if (!wrap || !player) return;

      wrap.addEventListener('mousemove', function(e) {
        var rect = wrap.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var cx = rect.width / 2;
        var cy = rect.height / 2;
        var dx = (x - cx) / cx;
        var dy = (y - cy) / cy;
        var rx = -dy * 25;
        var ry = dx * 25;
        player.style.transform = 'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
      });

      wrap.addEventListener('mouseleave', function() {
        player.style.transform = 'rotateX(0deg) rotateY(0deg)';
      });
    })();

    (function() {
      var btn = document.getElementById('shopBtn');
      if (!btn) return;
      var parent = btn.parentNode;

      parent.addEventListener('mousemove', function(e) {
        var rect = parent.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var cx = rect.width / 2;
        var cy = rect.height / 2;
        var dx = (x - cx) / cx;
        var dy = (y - cy) / cy;
        btn.style.transform = 'translateY(-4px) scale(1.2) rotateX(' + (-dy * 8) + 'deg) rotateY(' + (dx * 8) + 'deg)';
      });

      parent.addEventListener('mouseleave', function() {
        btn.style.transform = '';
      });
    })();
  </script>
</body>
</html>
